name: Add supervisor dashboard navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Patch navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('site/index.html')
          text = index.read_text(encoding='utf-8')
          old = '<a class="quiet-button" href="fleet-status.html">Fleet Status</a><span class="admin-pill" id="accessState">View only</span>'
          new = '<a class="quiet-button" href="fleet-status.html">Fleet Status</a><a class="quiet-button" href="supervisor-dashboard.html">Supervisor Dashboard</a><span class="admin-pill" id="accessState">View only</span>'
          if old in text and 'href="supervisor-dashboard.html"' not in text:
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          fleet = Path('site/fleet-status.html')
          text = fleet.read_text(encoding='utf-8')
          old = '<a class="button" href="./">Supply Requests</a><span class="pill neutral" id="accessState">View only</span>'
          new = '<a class="button" href="./">Supply Requests</a><a class="button" href="supervisor-dashboard.html">Supervisor Dashboard</a><span class="pill neutral" id="accessState">View only</span>'
          if old in text and 'href="supervisor-dashboard.html"' not in text:
              text = text.replace(old, new, 1)
          fleet.write_text(text, encoding='utf-8')

          Path('site/.pages-refresh').write_text('Supervisor Dashboard navigation added.\n', encoding='utf-8')
          PY

      - name: Commit patched site
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fleet-status.html .pages-refresh
          git diff --cached --quiet && exit 0
          git commit -m "Add supervisor dashboard navigation"
          git push origin gh-pages
