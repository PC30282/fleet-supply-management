name: Add supervisor fleet features

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Patch follow-up fixes
        run: |
          cat > /tmp/patch_followup.py <<'PY'
          from pathlib import Path

          index = Path('site/index.html')
          page = index.read_text(encoding='utf-8')
          page = page.replace('replace(/"/g,"""")', 'replace(/"/g,\'""\')')
          index.write_text(page, encoding='utf-8')

          fleet = Path('site/fleet-status.html')
          text = fleet.read_text(encoding='utf-8')

          if 'async function notificationSettings()' not in text:
              marker = 'async function addAudit(action,entityType,entityId,vehicleVrm,item,details,actor){try{await db.rpc("add_audit_log",{audit_action:action,audit_entity_type:entityType,audit_entity_id:entityId||null,audit_vehicle_vrm:vehicleVrm||null,audit_item:item||null,audit_details:details||null,audit_actor:actor||supervisorName()})}catch(error){console.warn("Audit log unavailable",error)}}'
              helper = marker + 'async function notificationSettings(){try{const result=await db.from("app_settings").select("key,value").in("key",["notification_frequency","notification_email"]);if(result.error)return{frequency:"disabled",email:""};const settings=Object.fromEntries((result.data||[]).map(row=>[row.key,row.value]));return{frequency:settings.notification_frequency||"disabled",email:settings.notification_email||""}}catch(error){console.warn("Notification settings unavailable",error);return{frequency:"disabled",email:""}}}async function notifyVehicleStatus(vehicle,status,reason,collar){try{const settings=await notificationSettings();if(!settings.email||settings.frequency==="disabled")return;const request={section:"Fleet Status",item:`Vehicle ${status}`,vehicle:formatVrm(vehicle.vrm),quantity:1,requester:collar,notes:reason,status:"Pending",created_at:new Date().toISOString()};if(settings.frequency==="per_submission"){await db.functions.invoke("notify-request",{body:{email:settings.email,frequency:settings.frequency,request}});return}await db.from("notification_queue").insert({recipient_email:settings.email,frequency:settings.frequency,request_id:null,section:request.section,item:request.item,vehicle:request.vehicle,quantity:request.quantity,requester:request.requester,notes:request.notes,created_at:request.created_at})}catch(error){console.warn("Status notification unavailable",error)}}'
              text = text.replace(marker, helper, 1)

          if 'notifyVehicleStatus(v,status,reason||"",clean)' not in text:
              text = text.replace('await loadData();showToast(`Status changed from ${previous} to ${status}.`)', 'if(status!=="On-Road")await notifyVehicleStatus(v,status,reason||"",clean);await loadData();showToast(`Status changed from ${previous} to ${status}.`)', 1)

          fleet.write_text(text, encoding='utf-8')

          Path('site/.pages-refresh').write_text('Follow-up feature fixes applied.\n', encoding='utf-8')
          PY
          python /tmp/patch_followup.py

      - name: Commit patched site
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fleet-status.html .pages-refresh
          git diff --cached --quiet && exit 0
          git commit -m "Fix export quoting and fleet status notifications"
          git push origin gh-pages
