name: Fix notification handling

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Patch notification handling
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('site/index.html')
          page = index.read_text(encoding='utf-8')
          old = 'async function handleNotification(request){const frequency=settings.notification_frequency||"disabled";if(frequency==="disabled")return;const email=settings.notification_email||supervisorUser?.email||"";if(!email)return;if(frequency==="per_submission"){const {error}=await db.functions.invoke("notify-request",{body:{frequency,email,request}});if(error)console.warn("notify-request failed",error);return}const {error}=await db.from("notification_queue").insert({frequency,email,request_id:request.id,request_data:request});if(error)console.warn("notification queue unavailable",error)}'
          new = 'async function handleNotification(request){const frequency=settings.notification_frequency||"disabled";if(frequency==="disabled")return true;const email=settings.notification_email||supervisorUser?.email||"";if(!email){showToast("Request saved, but no supervisor notification email is set.");return false}if(frequency==="per_submission"){const {error}=await db.functions.invoke("notify-request",{body:{frequency,email,request}});if(error){console.error("notify-request failed",error);showToast("Request saved, but email notification failed. Check the Supabase notify-request function and Resend key.");return false}return true}const queueRow={frequency,email,recipient_email:email,request_id:request.id||null,request_data:request,section:request.section,item:request.item,vehicle:request.vehicle,quantity:request.quantity,requester:request.requester,notes:request.notes};const {error}=await db.from("notification_queue").insert(queueRow);if(error){console.error("notification queue unavailable",error);showToast("Request saved, but notification queue failed. Run notification-schema.sql.");return false}return true}'
          if old in page:
              page = page.replace(old, new, 1)
          page = page.replace('const saved=await createRequest(payload);handleNotification(saved);if(duplicate)', 'const saved=await createRequest(payload);await handleNotification(saved);if(duplicate)', 1)
          page = page.replace('created++;handleNotification(saved)}', 'created++;await handleNotification(saved)}', 1)
          index.write_text(page, encoding='utf-8')

          fleet = Path('site/fleet-status.html')
          text = fleet.read_text(encoding='utf-8')
          old = 'async function notifyVehicleStatus(vehicle,status,reason,collar){try{const settings=await notificationSettings();if(!settings.email||settings.frequency==="disabled")return;const request={section:"Fleet Status",item:`Vehicle ${status}`,vehicle:formatVrm(vehicle.vrm),quantity:1,requester:collar,notes:reason,status:"Pending",created_at:new Date().toISOString()};if(settings.frequency==="per_submission"){await db.functions.invoke("notify-request",{body:{email:settings.email,frequency:settings.frequency,request}});return}await db.from("notification_queue").insert({recipient_email:settings.email,frequency:settings.frequency,request_id:null,section:request.section,item:request.item,vehicle:request.vehicle,quantity:request.quantity,requester:request.requester,notes:request.notes,created_at:request.created_at})}catch(error){console.warn("Status notification unavailable",error)}}'
          new = 'async function notifyVehicleStatus(vehicle,status,reason,collar){try{const settings=await notificationSettings();if(!settings.email||settings.frequency==="disabled")return true;const request={section:"Fleet Status",item:`Vehicle ${status}`,vehicle:formatVrm(vehicle.vrm),quantity:1,requester:collar,notes:reason,status:"Pending",created_at:new Date().toISOString()};if(settings.frequency==="per_submission"){const {error}=await db.functions.invoke("notify-request",{body:{email:settings.email,frequency:settings.frequency,request}});if(error){console.error("notify-request failed",error);showToast("Status saved, but email notification failed. Check the Supabase notify-request function and Resend key.");return false}return true}const {error}=await db.from("notification_queue").insert({recipient_email:settings.email,email:settings.email,frequency:settings.frequency,request_id:null,request_data:request,section:request.section,item:request.item,vehicle:request.vehicle,quantity:request.quantity,requester:request.requester,notes:request.notes,created_at:request.created_at});if(error){console.error("notification queue unavailable",error);showToast("Status saved, but notification queue failed. Run notification-schema.sql.");return false}return true}catch(error){console.error("Status notification unavailable",error);showToast("Status saved, but notification could not run.");return false}}'
          if old in text:
              text = text.replace(old, new, 1)
          fleet.write_text(text, encoding='utf-8')

          Path('site/.pages-refresh').write_text('Notification handling improved.\n', encoding='utf-8')
          PY

      - name: Commit patched site
        run: |
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html fleet-status.html .pages-refresh
          git diff --cached --quiet && exit 0
          git commit -m "Improve notification error handling"
          git push origin gh-pages
